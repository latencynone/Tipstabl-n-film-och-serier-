(function () {
  try {
    var t = JSON.parse(localStorage.getItem("tipstablan:tema"));
    if (t) document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}

<style>
*{box-sizing:border-box}
:root{
  --ink:#08080D; --panel:#17181F; --line:#42445C;
  --film:#FFD666; --serie:#7EF0F7; --fav:#FF7F9A; --sett:#7CFF9B; --want:#FFA94D;
  --rt:#FF6B4A; --mc:#8FD3FF; --mine:#C9A6FF;
  --txt:#FFFFFF; --dim:#C7C9DE; --dim2:#E9EAF7; --on-accent:var(--ink); --desc:#E7E8F5;
  --display:'Oswald','Arial Narrow',Impact,sans-serif;
  --body:'Inter',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --radius:0; --shadow:none;
  color-scheme: dark;
}

/* ---- Modern: mörk, ren app-känsla, dova accentfärger, rundade ytor ---- */
[data-theme="modern"]{
  --ink:#0B0D12; --panel:#151821; --line:#262B38;
  --film:#8FB3FF; --serie:#5EEAD4; --fav:#FDA4AF; --sett:#6EE7B7; --want:#FBBF66;
  --rt:#FCA5A5; --mc:#7DD3FC; --mine:#C4B5FD;
  --txt:#F3F4F8; --dim:#8B93A7; --dim2:#BDC4D6; --on-accent:var(--ink); --desc:#D7DAE5;
  --display:'Manrope','Inter',system-ui,sans-serif;
  --body:'Inter',system-ui,-apple-system,sans-serif;
  --radius:10px; --shadow:0 8px 24px -14px rgba(0,0,0,.6);
  color-scheme: dark;
}

/* ---- Mjuk: ljus, varm, rundad designhus-känsla, djupare dova accenter ---- */
[data-theme="soft"]{
  --ink:#FFFFFF; --panel:#F5F5F7; --line:#D2D2D7;
  --film:#0071E3; --serie:#12707D; --fav:#FF375F; --sett:#34C759; --want:#A65200;
  --rt:#FF3B30; --mc:#155D91; --mine:#AF52DE;
  --txt:#1D1D1F; --dim:#6E6E73; --dim2:#48484A; --on-accent:#FFFFFF; --desc:#3A3A3C;
  --display:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',system-ui,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',system-ui,sans-serif;
  --radius:18px; --shadow:0 2px 8px rgba(0,0,0,.06),0 14px 30px -18px rgba(0,0,0,.16);
  color-scheme: light;
}
html{background:var(--ink)}
html,body{margin:0;padding:0}
body{background:var(--ink);color:var(--txt);font-family:var(--body);
  min-height:100vh;padding-bottom:56px;-webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%}
.wrap{max-width:880px;margin:0 auto;padding:0 16px}

.bar{background:var(--film);color:var(--on-accent);padding:10px 16px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar h1{font-family:var(--display);font-weight:700;font-size:26px;
  letter-spacing:.06em;text-transform:none;margin:0;line-height:26px;cursor:pointer}
.hamburger{background:none;border:none;color:inherit;display:flex;flex-direction:column;
  justify-content:space-between;width:22px;height:16px;flex:0 0 22px;cursor:pointer;
  opacity:.85;padding:0;align-self:center}
.hamburger:hover{opacity:1}
.hb-bar{display:block;width:100%;height:2px;border-radius:1px;background:currentColor}
.bar-right{margin-left:auto}
.today{font-family:var(--mono);font-size:11px;letter-spacing:.1em}
.menu-pick-row{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:13px 16px;border-bottom:1px solid var(--line)}
.menu-pick-lbl{font-family:var(--body);font-size:14px;color:var(--txt)}
.menu-pick-select{background:var(--ink);border:1px solid var(--line);color:var(--txt);
  font-family:var(--mono);font-size:12px;padding:7px 26px 7px 10px;border-radius:var(--radius);
  -webkit-appearance:none;appearance:none;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 13px) 55%,calc(100% - 9px) 55%;background-size:4px 4px;background-repeat:no-repeat}

.menu-dropdown{display:none;position:absolute;top:56px;left:16px;z-index:20;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:0 12px 28px -10px rgba(0,0,0,.5);overflow:hidden;min-width:220px}
.menu-dropdown.open{display:block}
.menu-dropdown button{display:block;width:100%;text-align:left;background:none;border:none;
  border-bottom:1px solid var(--line);color:var(--txt);font-family:var(--body);font-size:14px;
  padding:13px 16px;cursor:pointer}
.menu-dropdown button:last-child{border-bottom:none}
.menu-dropdown button:hover{background:var(--ink)}
.menu-dropdown #menuRemovedCount{color:var(--dim);font-family:var(--mono);font-size:11px}
.sub{font-family:var(--mono);font-size:clamp(8.5px,2.6vw,11px);color:var(--dim);
  letter-spacing:.02em;padding:12px 0 0;margin:0;text-transform:uppercase;
  white-space:nowrap;overflow:hidden}
.backup-link-row{display:flex;gap:6px}
.backup-link-row input{flex:1;min-width:0;background:var(--ink);border:1px solid var(--line);
  color:var(--txt);font-family:var(--mono);font-size:11px;padding:9px 10px;border-radius:var(--radius)}
.who-row{display:flex;gap:5px;align-items:center;flex-wrap:nowrap;margin:-6px 0 16px;
  overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
.who-row::-webkit-scrollbar{display:none}
.who-row:empty{display:none}
.who-row .chip{flex:0 0 auto;padding:6px 8px;letter-spacing:.02em;white-space:nowrap}
.who-lbl{flex:0 0 auto;white-space:nowrap;font-family:var(--mono);font-size:10px;
  letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-right:2px}
.who-sel{background:transparent;border:1px solid var(--line);color:var(--want);
  font-family:var(--mono);font-size:11px;font-weight:700;padding:10px 8px;min-height:44px;
  border-radius:var(--radius);-webkit-appearance:none;appearance:none;cursor:pointer}
@media (hover: hover) and (pointer: fine){
  .who-sel:hover{border-color:var(--want)}
}
.who-sel[data-set="1"]{border-color:var(--want);background:color-mix(in srgb, var(--want) 14%, transparent)}
.who-sel:focus-visible{outline:2px solid var(--film);outline-offset:2px}

.tabs{display:flex;gap:2px;margin:16px 0 12px}
.search-row{display:flex;align-items:center;gap:0;margin-bottom:14px;position:relative}
.search-btn{position:absolute;left:0;top:0;background:none;border:none;color:var(--dim);
  cursor:pointer;width:44px;height:44px;font-size:17px;display:flex;align-items:center;justify-content:center}
.search-btn:hover{color:var(--txt)}
.search-input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--txt);
  font-family:var(--body);font-size:15px;padding:11px 96px 11px 44px;border-radius:var(--radius);
  -webkit-appearance:none;appearance:none}
.search-count{position:absolute;right:42px;top:50%;transform:translateY(-50%);
  font-family:var(--mono);font-size:10px;color:var(--dim);pointer-events:none;white-space:nowrap}
.search-input::placeholder{color:var(--dim)}
.search-input:focus-visible{outline:2px solid var(--film);outline-offset:2px}
.search-input::-webkit-search-cancel-button{display:none}
.search-clear{position:absolute;right:0;top:0;background:none;border:none;color:var(--dim);
  cursor:pointer;width:44px;height:44px;font-size:16px}
.search-clear:hover{color:var(--txt)}
.tab{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--dim);
  font-family:var(--display);font-size:14px;letter-spacing:.09em;text-transform:uppercase;
  padding:10px 4px;cursor:pointer;border-radius:var(--radius);transition:.16s;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tab:hover{color:var(--txt)}
.tab-label{display:block}
.tab-ic{display:block;font-size:14px;line-height:1;font-family:var(--body)}
.ic-empty{visibility:hidden}
.ic-want{color:var(--want);font-size:19px}
.ic-sett{color:var(--sett)}
.ic-fav{color:var(--fav)}
.tab[data-on] .tab-ic{color:var(--on-accent)}
.tab[data-on="film"]{background:var(--film);color:var(--on-accent);border-color:var(--film)}
.tab[data-on="serie"]{background:var(--serie);color:var(--on-accent);border-color:var(--serie)}
.tab[data-on="favorit"]{background:var(--fav);color:var(--on-accent);border-color:var(--fav)}
.tab[data-on="sett"]{background:var(--sett);color:var(--on-accent);border-color:var(--sett)}
.tab[data-on="villse"]{background:var(--want);color:var(--on-accent);border-color:var(--want)}
.tab b{font-family:var(--mono);font-size:11px;font-weight:700;margin-left:6px}

.ctrl{border:1px solid var(--line);background:var(--panel);padding:12px;margin-bottom:18px;border-radius:var(--radius)}
.lbl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--dim);
  text-transform:uppercase;display:block;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.06em;
  padding:6px 10px;border:1px solid var(--line);background:transparent;color:var(--dim);
  cursor:pointer;transition:.16s;border-radius:var(--radius)}
.chip[data-on="1"]{background:var(--film);color:var(--on-accent);border-color:var(--film);box-shadow:var(--shadow)}
.row2{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
.fetch-status{font-family:var(--mono);font-size:11px;color:var(--dim);
  letter-spacing:.03em;margin:10px 0 0;line-height:1.5}
.fetch-status b{color:var(--txt);font-weight:700}
.fetch-status.is-new{color:var(--sett)}
.fetch-status.is-new b{color:var(--sett)}
[data-theme="soft"] .fetch-status.is-new{color:var(--txt)}
[data-theme="soft"] .fetch-status.is-new b{color:var(--txt)}
.btn{font-family:var(--display);font-size:14px;letter-spacing:.09em;text-transform:uppercase;
  background:var(--film);color:var(--on-accent);border:none;padding:11px 18px;cursor:pointer;border-radius:var(--radius)}
.btn:active{transform:translateY(1px)}
.btn-outline{background:transparent;color:var(--txt);border:1px solid var(--line)}
.btn-outline:hover{border-color:var(--txt)}
.refresh-ic{font-size:1.2em;font-weight:700;display:inline-block;vertical-align:-2px;margin-right:2px;line-height:1}

#page:empty{display:none}
.page-back{background:none;border:1px solid var(--line);color:var(--dim);font-family:var(--mono);
  font-size:12px;padding:8px 14px;border-radius:var(--radius);cursor:pointer;margin-bottom:16px}
.page-back:hover{color:var(--txt);border-color:var(--txt)}
.page-title{font-family:var(--display);font-size:22px;margin:0 0 4px;text-transform:none;letter-spacing:normal}
.select-wrap{position:relative;flex:1 1 160px}
.select-wrap:after{content:'▾';position:absolute;right:10px;top:50%;transform:translateY(-50%);
  color:var(--dim);pointer-events:none;font-size:11px}
.gsel{appearance:none;-webkit-appearance:none;width:100%;background:var(--ink);
  border:1px solid var(--line);color:var(--txt);font-family:var(--mono);font-size:12px;
  padding:10px 28px 10px 10px;cursor:pointer;border-radius:var(--radius)}
.chip:focus-visible,.tab:focus-visible,.btn:focus-visible,.heart:focus-visible,
.watch:focus-visible,.trash:focus-visible,.gsel:focus-visible,.rm-restore:focus-visible,
.title a:focus-visible{outline:2px solid var(--film);outline-offset:2px}

.item{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.rail{width:52px;flex:0 0 52px;text-align:right;font-family:var(--mono);
  position:relative;padding-right:14px}
.rail:after{content:'';position:absolute;right:0;top:6px;bottom:-16px;width:1px;background:var(--line)}
.dot{position:absolute;right:-3px;top:6px;width:7px;height:7px;background:var(--film)}
.item[data-kind="serie"] .dot{background:var(--serie)}
.yr{font-size:15px;font-weight:700;line-height:1}
.md{font-size:10px;color:var(--dim);letter-spacing:.08em;margin-top:4px}
.body{flex:1;min-width:0}
.head{display:flex;gap:10px;align-items:flex-start}
.title{font-family:var(--display);font-size:21px;font-weight:600;line-height:1.15;
  letter-spacing:.01em;margin:0;flex:1}
.title a{color:inherit;text-decoration:none;border-bottom:1px solid transparent}
.title a:hover{border-bottom-color:var(--film)}
.meta{font-family:var(--mono);font-size:11px;color:var(--dim);margin:7px 0 0;
  letter-spacing:.05em;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.svc{color:var(--on-accent);background:var(--film);padding:2px 6px;font-weight:700;border-radius:calc(var(--radius) * .4)}
.item[data-kind="serie"] .svc{background:var(--serie)}
.imdb{color:var(--film);font-weight:700}
.rt{color:var(--rt);font-weight:700;text-decoration:none}
.rt:hover{text-decoration:underline}
.mc{color:var(--mc);font-weight:700;text-decoration:none}
.mc:hover{text-decoration:underline}
.rate-sel{background:transparent;border:1px solid var(--line);color:var(--mine);
  font-family:var(--mono);font-size:11px;font-weight:700;padding:10px 8px;min-height:44px;
  border-radius:var(--radius);-webkit-appearance:none;appearance:none;cursor:pointer}
@media (hover: hover) and (pointer: fine){
  .rate-sel:hover{border-color:var(--mine)}
}
.rate-sel[data-rated="1"]{border-color:var(--mine);background:rgba(201,166,255,.14)}
.rate-sel:focus-visible{outline:2px solid var(--film);outline-offset:2px}
.more-tog{background:none;border:none;color:var(--dim);font-family:var(--mono);font-size:11px;
  font-weight:700;letter-spacing:.04em;padding:0;margin:2px 0 0;cursor:pointer;
  display:flex;align-items:center;min-height:44px}
.more-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  margin:2px 0 4px;padding-top:8px;border-top:1px dashed var(--line)}
.more-row[hidden]{display:none}
.desc{font-size:14px;line-height:1.55;color:var(--desc);margin:8px 0 0}
.actions{display:flex;gap:8px;flex-shrink:0}
.heart,.watch,.trash,.star{background:none;border:1px solid var(--line);color:var(--dim);cursor:pointer;
  width:44px;height:44px;flex:0 0 44px;font-size:19px;line-height:1;transition:.16s;border-radius:var(--radius)}
.heart[data-on="1"]{color:var(--fav);border-color:var(--fav);background:rgba(255,127,154,.12)}
.watch{color:var(--dim2)}
.watch[data-on="1"]{color:var(--sett);border-color:var(--sett);background:rgba(124,255,155,.12)}
.star[data-on="1"]{color:var(--want);border-color:var(--want);background:rgba(255,169,77,.14)}
.trash{color:#FF6259;border-color:rgba(255,98,89,.4)}
/* Hover-effekter bara på enheter med riktig pekare. På pekskärm ligger
   annars hover-läget kvar efter en tryckning, så nästa kort som hamnar
   på samma plats i listan såg markerat ut. */
@media (hover: hover) and (pointer: fine){
  .heart:hover{color:var(--fav);border-color:var(--fav)}
  .watch:hover{color:var(--sett);border-color:var(--sett)}
  .star:hover{color:var(--want);border-color:var(--want)}
  .trash:hover{color:#FF3B2E;border-color:#FF3B2E;background:rgba(255,98,89,.12)}
  .more-tog:hover{color:var(--txt)}
}

#removedPanel:empty{display:none}
#removedPanel{border:1px dashed var(--line);padding:4px 12px;margin:-6px 0 18px;font-family:var(--mono);font-size:12px;border-radius:var(--radius)}
.rm-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.profile-list{margin:6px 0 4px}
.profile-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.profile-row:last-child{border-bottom:none}
.profile-row-actions{display:flex;gap:6px;flex-shrink:0}
.rm-row:last-child{border-bottom:none}
.rm-restore{background:none;border:1px solid var(--line);color:var(--dim);font-family:var(--mono);
  font-size:11px;padding:5px 9px;cursor:pointer;border-radius:var(--radius)}
.rm-restore:hover{color:var(--txt);border-color:var(--txt)}

.load{font-family:var(--mono);font-size:12px;color:var(--dim);letter-spacing:.1em;
  text-transform:uppercase;text-align:center;padding:40px 0}
.empty{border:1px dashed var(--line);padding:28px 20px;text-align:center;border-radius:var(--radius)}
.empty p{margin:0 0 6px;font-family:var(--display);font-size:18px;letter-spacing:.05em;text-transform:uppercase}
.empty span{font-size:13px;color:var(--dim)}
.foot{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.08em;
  text-align:center;padding-top:26px;line-height:1.9}
.foot-link{background:none;border:none;color:var(--dim);font-family:var(--mono);
  font-size:11px;letter-spacing:.08em;cursor:pointer;padding:12px;min-height:44px}
.foot-link:hover{color:var(--txt)}
.info-h{font-family:var(--display);font-size:15px;margin:22px 0 6px;
  text-transform:none;letter-spacing:normal}
.info-h:first-of-type{margin-top:18px}
.info-p{font-size:13px;line-height:1.6;color:var(--dim);margin:0}
.icon-guide{display:flex;flex-direction:column;gap:14px;margin-top:8px}
.icon-row{display:flex;gap:14px;align-items:flex-start}
.icon-demo{font-size:22px;line-height:1.4;flex:0 0 26px;text-align:center}
.icon-row div{font-size:13px;line-height:1.55;color:var(--dim)}
.icon-row b{color:var(--txt)}
.fade{animation:in .32s ease both}
@keyframes in{from{opacity:0;transform:translateY(7px)}}
@media (prefers-reduced-motion:reduce){.fade{animation:none!important}}
@media (max-width:520px){
  .title{font-size:18px}
  .rail{width:44px;flex:0 0 44px;padding-right:11px}
  .bar h1{font-size:21px}
  .btn,.select-wrap{width:100%;flex:1 1 100%}
  .tab{font-size:11px;padding:9px 2px}
  .tab b{margin-left:3px}
}

/* ---- Strukturella skillnader för Modern och Mjuk ----
   Samma HTML, men versaler/spärrning stängs av och korten blir
   fristående rutor med kant, radie och skugga istället för en
   löpande text-tv-lista med tidslinje. ---- */
[data-theme="modern"] .bar h1, [data-theme="soft"] .bar h1,

/* ---- Mjuk: Apple-liknande layout (se bifogad referensbild) ----

<body>

<div class="wrap">

</div>

<script>
(function () {
  var SERVICES = ["Netflix", "Apple TV+", "HBO Max", "Prime Video", "Disney+"];
  var NOW = new Date();
  var MONTHS = ["JAN","FEB","MAR","APR","MAJ","JUN","JUL","AUG","SEP","OKT","NOV","DEC"];
  var store = {
    get: function (k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
    remove: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
  };

  /* ============ profiler ============
     All personlig data (favoriter, sett, vill se, sällskap, betyg,
     borttaget, rotationshistorik) sparas per profilnamn, t.ex.
     "tipstablan:favoriter:Martin". PROFILES_KEY/ACTIVE_PROFILE_KEY är
     de enda nycklarna som INTE är profil-specifika.
  ==================================== */
  var PROFILES_KEY = "tipstablan:profiler";
  var ACTIVE_PROFILE_KEY = "tipstablan:aktiv-profil";
  var DEFAULT_PROFILE = "Jag";

  var BASE_FAV = "tipstablan:favoriter";
  var BASE_SEEN = "tipstablan:visade";
  var BASE_WATCHED = "tipstablan:sett";
  var BASE_WANT = "tipstablan:vill-se";
  var BASE_WANTWHO = "tipstablan:vill-se-sallskap";
  var BASE_REMOVED = "tipstablan:borttagna";
  var BASE_RATING = "tipstablan:betyg";
  var PROFILE_BASE_KEYS = [BASE_FAV, BASE_SEEN, BASE_WATCHED, BASE_WANT, BASE_WANTWHO, BASE_REMOVED, BASE_RATING];

  // Körs en gång: om appen aldrig haft profiler men det finns gammal,
  // o-namnrymd data (från innan den här funktionen fanns), flyttas den
  // in under en första profil i stället för att gå förlorad.
  function migrateLegacyDataIfNeeded() {
    var profiles = store.get(PROFILES_KEY);
    if (profiles && profiles.length) return profiles;

    var hadAny = false;
    PROFILE_BASE_KEYS.forEach(function (base) {
      if (store.get(base) !== null) hadAny = true;
    });

    var name = DEFAULT_PROFILE;
    if (hadAny) {
      PROFILE_BASE_KEYS.forEach(function (base) {
        var v = store.get(base);
        if (v !== null) store.set(base + ":" + name, v);
      });
    }
    var list = [name];
    store.set(PROFILES_KEY, list);
    store.set(ACTIVE_PROFILE_KEY, name);
    return list;
  }

  var ALL_PROFILES = migrateLegacyDataIfNeeded();
  var ACTIVE_PROFILE = store.get(ACTIVE_PROFILE_KEY) || ALL_PROFILES[0] || DEFAULT_PROFILE;
  if (ALL_PROFILES.indexOf(ACTIVE_PROFILE) === -1) ALL_PROFILES.push(ACTIVE_PROFILE);

  function nsKey(base) { return base + ":" + ACTIVE_PROFILE; }
  function FAV_KEY() { return nsKey(BASE_FAV); }
  function SEEN_KEY() { return nsKey(BASE_SEEN); }
  function WATCHED_KEY() { return nsKey(BASE_WATCHED); }
  function WANT_KEY() { return nsKey(BASE_WANT); }
  function WANTWHO_KEY() { return nsKey(BASE_WANTWHO); }
  function REMOVED_KEY() { return nsKey(BASE_REMOVED); }
  function RATING_KEY() { return nsKey(BASE_RATING); }

  // Sällskapsalternativ för Vill se. Lägg till fler här vid behov –
  // både kortens väljare och filterraden byggs från den här listan.
  var WHO_OPTIONS = [
    { id: "sjalv", label: "Själv" },
    { id: "familj", label: "Familjen" },
    { id: "emma", label: "M&E" }
  ];
  var THEME_KEY = "tipstablan:tema";

  /* ============ TITELBANKEN ============
     Läses in från titles.json vid start (se längst ner i skriptet),
     istället för att ligga hårdkodad här. Det gör att det schemalagda
     GitHub Actions-jobbet kan uppdatera titlarna automatiskt utan att
     röra den här filen.
  ==================================== */

  var POOL = { film: [], serie: [] };
  var ALL_ITEMS = [];
  var BY_KEY = {};

  // Slår ihop de ~43 specifika genre-strängarna i titelbanken till 10
  // bredare huvudkategorier, bara för filtret. Kortens egen genre-tagg
  // (t.ex. "Sci-fi/Action") visas fortfarande oförändrad.
  var GENRE_GROUPS = {
    "Drama": "Drama", "Historiskt drama": "Drama", "Krig": "Drama", "Sjukhusdrama": "Drama",
    "Komedi": "Komedi", "Drama/Komedi": "Komedi", "Action/Komedi": "Komedi", "Dramakomedi": "Komedi",
    "Mysteriekomedi": "Komedi", "Skräckkomedi": "Komedi", "Satir": "Komedi", "Drama/Satir": "Komedi",
    "Romantisk komedi": "Komedi", "Kriminalkomedi": "Komedi", "Svart komedi": "Komedi",
    "Superhjälte": "Action & Äventyr", "Action/Sci-fi": "Action & Äventyr", "Action": "Action & Äventyr",
    "Action/Kriminal": "Action & Äventyr", "Äventyr": "Action & Äventyr",
    "Sci-fi": "Sci-fi & Fantasy", "Sci-fi/Action": "Sci-fi & Fantasy", "Sci-fi/Thriller": "Sci-fi & Fantasy",
    "Fantasy": "Sci-fi & Fantasy",
    "Skräck/Drama": "Skräck", "Skräck/Sci-fi": "Skräck", "Skräck": "Skräck", "Drama/Skräck": "Skräck",
    "Thriller": "Thriller", "Thriller/Drama": "Thriller", "Spionthriller": "Thriller", "Politisk thriller": "Thriller",
    "Mysterium": "Kriminal & Mysterium", "Kriminaldrama": "Kriminal & Mysterium",
    "Drama/Kriminal": "Kriminal & Mysterium", "Deckare": "Kriminal & Mysterium",
    "Animerat": "Animerat", "Animerat/Musik": "Animerat",
    "Familj/Musikal": "Musik & Musikal", "Biografi/Musik": "Musik & Musikal", "Musikal": "Musik & Musikal",
    "Sport/Drama": "Biografi & Sport", "Biografi/Sport": "Biografi & Sport",

    // TMDb:s engelska standardgenrer (används av titlar som hittas automatiskt
    // varje vecka) – mappade till samma tio fack som ovan.
    "Action & Adventure": "Action & Äventyr", "Adventure": "Action & Äventyr",
    "Western": "Action & Äventyr",
    "Comedy": "Komedi", "Romance": "Komedi",
    "Science Fiction": "Sci-fi & Fantasy", "Sci-Fi & Fantasy": "Sci-fi & Fantasy",
    "Horror": "Skräck",
    "Crime": "Kriminal & Mysterium", "Mystery": "Kriminal & Mysterium",
    "Animation": "Animerat",
    "Music": "Musik & Musikal",
    "Documentary": "Biografi & Sport", "Reality": "Biografi & Sport",
    "Family": "Drama", "History": "Drama", "War": "Drama", "War & Politics": "Drama",
    "TV Movie": "Drama", "Kids": "Drama", "News": "Drama", "Soap": "Drama", "Talk": "Drama"
  };
  function genreBucket(g) { return GENRE_GROUPS[g] || g; }

  var GENRES = Array.from(new Set(ALL_ITEMS.map(function (it) { return genreBucket(it.genre); })))
    .sort(function (a, b) { return a.localeCompare(b, "sv"); });

  /* ============ hjälpare ============ */

  function parseDate(it) {
    var s = it.date;
    var d = new Date(s.length === 7 ? s + "-01" : s);
    return isNaN(d.getTime()) ? new Date("2021-01-01") : d;
  }
  function newestFirst(a, b) { return parseDate(b) - parseDate(a); }
  // Sorterar enligt användarens val; vid lika IMDb-betyg avgör datumet.
  function sortList(list) {
    var arr = list.slice();
    if (state.sort === "mine") {
      return arr.sort(function (a, b) {
        var av = state.ratings[keyOf(a)] || -1, bv = state.ratings[keyOf(b)] || -1;
        return (bv - av) || (parseDate(b) - parseDate(a));
      });
    }
    var field = { imdb: "imdb", rt: "rt", mc: "mc" }[state.sort];
    if (field) {
      return arr.sort(function (a, b) {
        // Titlar som saknar betyg hamnar sist i stället för överst.
        var av = a[field] || -1, bv = b[field] || -1;
        return (bv - av) || (parseDate(b) - parseDate(a));
      });
    }
    return arr.sort(newestFirst);
  }
  function keyOf(it) { return it.kind + ":" + it.title + ":" + it.date; }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  // Äldre versioner sparade hela objekt som favoriter; gör om till nycklar.
  function normalizeKeys(list) {
    if (!Array.isArray(list)) return [];
    return list.map(function (x) {
      if (typeof x === "string") return x;
      if (x && x.kind && x.title) return keyOf(x);
      return null;
    }).filter(Boolean);
  }

  var state = {
    tab: "film",
    activeProfile: ACTIVE_PROFILE,
    profiles: ALL_PROFILES.slice(),
    theme: store.get(THEME_KEY) || "retro",
    active: SERVICES.slice(),
    genre: "",
    favorites: normalizeKeys(store.get(FAV_KEY())),
    watched: normalizeKeys(store.get(WATCHED_KEY())),
    wantToSee: normalizeKeys(store.get(WANT_KEY())),
    wantWho: store.get(WANTWHO_KEY()) || {},
    whoFilter: "",
    sort: "datum",
    removed: normalizeKeys(store.get(REMOVED_KEY())),
    ratings: store.get(RATING_KEY()) || {},
    seen: store.get(SEEN_KEY()) || [],
    returnTab: "film",
    expanded: {},
    search: "",
    lastFetchedTitle: null,
    lastFetchedKind: null,
    fetchAdded: null,
    fetchAddedCount: 0,
    shown: { film: [], serie: [] }
  };

  // Läser om alla profil-specifika fält från lagringen för den nu aktiva
  // profilen. Används både vid start och varje gång man byter profil.
  function loadProfileData() {
    state.favorites = normalizeKeys(store.get(FAV_KEY()));
    state.watched = normalizeKeys(store.get(WATCHED_KEY()));
    state.wantToSee = normalizeKeys(store.get(WANT_KEY()));
    state.wantWho = store.get(WANTWHO_KEY()) || {};
    state.removed = normalizeKeys(store.get(REMOVED_KEY()));
    state.ratings = store.get(RATING_KEY()) || {};
    state.seen = store.get(SEEN_KEY()) || [];
  }

  function closeMenu() {
    document.getElementById("menuDropdown").classList.remove("open");
    document.getElementById("menuBtn").setAttribute("aria-expanded", "false");
  }

  function switchProfile(name) {
    if (name === ACTIVE_PROFILE) return;
    ACTIVE_PROFILE = name;
    state.activeProfile = name;
    store.set(ACTIVE_PROFILE_KEY, name);
    loadProfileData();
    state.expanded = {};
    state.whoFilter = "";
    state.search = "";
    state.tab = "film";
    state.returnTab = "film";
    drawAll();
    render();
  }

  function renameActiveProfile(newName) {
    newName = (newName || "").trim();
    if (!newName || newName === ACTIVE_PROFILE) return;
    if (state.profiles.indexOf(newName) !== -1) {
      alert("Det namnet används redan av en annan profil.");
      return;
    }
    PROFILE_BASE_KEYS.forEach(function (base) {
      var v = store.get(base + ":" + ACTIVE_PROFILE);
      if (v !== null) store.set(base + ":" + newName, v);
      store.remove(base + ":" + ACTIVE_PROFILE);
    });
    var idx = state.profiles.indexOf(ACTIVE_PROFILE);
    if (idx !== -1) state.profiles[idx] = newName;
    store.set(PROFILES_KEY, state.profiles);
    ACTIVE_PROFILE = newName;
    state.activeProfile = newName;
    store.set(ACTIVE_PROFILE_KEY, newName);
    render();
  }

  function deleteProfile(name) {
    if (name === ACTIVE_PROFILE) return; // görs inte via UI, men skyddar ändå
    if (!confirm("Ta bort profilen \"" + name + "\" och all dess sparade data?\n\nGår inte att ångra.")) return;
    PROFILE_BASE_KEYS.forEach(function (base) {
      store.remove(base + ":" + name);
    });
    state.profiles = state.profiles.filter(function (p) { return p !== name; });
    store.set(PROFILES_KEY, state.profiles);
    render();
  }

  /* ============ backup via fil ============
     Enkel export/import: en nedladdad JSON-fil med favoriter, sett,
     vill se, sällskap, betyg och borttaget. Funkar likadant i Safari
     och i hemskärmsappen, oavsett webbadressens längd eller iOS
     ikon-cache – det är bara en vanlig fil.
  ==================================== */

  function buildBackupObj() {
    return {
      profileName: state.activeProfile,
      fav: state.favorites, watched: state.watched, want: state.wantToSee,
      who: state.wantWho, removed: state.removed, ratings: state.ratings
    };
  }

  // Säkerhetsspärr: importerad JSON kan i princip innehålla vad som helst.
  // Plockar bara ut egna, oskadliga nycklar/värden, och stryker uttryckligen
  // farliga objektnycklar (__proto__ m.fl.) om koden någon gång skulle byggas
  // om till en nyckel-för-nyckel-kopiering istället för en hel referens.
  function sanitizeObj(o, valueCheck) {
    var out = {};
    if (!o || typeof o !== "object" || Array.isArray(o)) return out;
    Object.keys(o).forEach(function (k) {
      if (k === "__proto__" || k === "constructor" || k === "prototype") return;
      if (typeof k !== "string" || k.length > 200) return;
      var v = o[k];
      if (valueCheck && !valueCheck(v)) return;
      out[k] = v;
    });
    return out;
  }

  // Skriver importerad data till EN VALD PROFILS lagring - inte nödvändigtvis
  // den som är aktiv just nu. Om profilen är ny läggs den till i listan.
  // Uppdaterar bara den synliga vyn (state.*) om det är den aktiva profilen.
  function applyBackupObj(b, targetProfile) {
    var favorites = normalizeKeys(b.fav);
    var watched = normalizeKeys(b.watched);
    var wantToSee = normalizeKeys(b.want);
    var wantWho = sanitizeObj(b.who, function (v) { return typeof v === "string" && v.length < 50; });
    var removed = normalizeKeys(b.removed);
    var ratings = sanitizeObj(b.ratings, function (v) {
      return typeof v === "number" && v >= 1 && v <= 10;
    });

    store.set(BASE_FAV + ":" + targetProfile, favorites);
    store.set(BASE_WATCHED + ":" + targetProfile, watched);
    store.set(BASE_WANT + ":" + targetProfile, wantToSee);
    store.set(BASE_WANTWHO + ":" + targetProfile, wantWho);
    store.set(BASE_REMOVED + ":" + targetProfile, removed);
    store.set(BASE_RATING + ":" + targetProfile, ratings);

    if (state.profiles.indexOf(targetProfile) === -1) {
      state.profiles.push(targetProfile);
      store.set(PROFILES_KEY, state.profiles);
    }

    if (targetProfile === ACTIVE_PROFILE) {
      loadProfileData();
    }
  }

  function exportBackupFile() {
    var data = JSON.stringify(buildBackupObj(), null, 2);
    var blob = new Blob([data], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var d = new Date();
    var stamp = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") +
      "-" + String(d.getDate()).padStart(2, "0");
    var a = document.createElement("a");
    a.href = url;
    a.download = "FILMoSERIER-" + state.activeProfile + "-" + stamp + ".json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }

  function importBackupFile(file) {
    var reader = new FileReader();
    reader.onload = function () {
      var incoming;
      try {
        incoming = JSON.parse(String(reader.result));
      } catch (e) {
        alert("Kunde inte läsa filen. Är det en export från den här appen?");
        return;
      }

      var suggested = (incoming.profileName && String(incoming.profileName).trim()) || "";
      var name = prompt(
        "Vilket namn hör den här datan till?\n\n" +
        "Redan sparade profiler: " + state.profiles.join(", "),
        suggested
      );
      if (name === null) return; // avbrutet
      name = name.trim();
      if (!name) { alert("Namnet kan inte vara tomt."); return; }

      var isActive = name === ACTIVE_PROFILE;
      var isExistingOther = !isActive && state.profiles.indexOf(name) !== -1;
      var isNew = state.profiles.indexOf(name) === -1;

      var proceed = true;
      if (isActive) {
        proceed = confirm("Skriva över din nuvarande profil (\"" + name + "\") med datan från filen?");
      } else if (isExistingOther) {
        proceed = confirm(
          "\"" + name + "\" finns redan som en sparad profil.\n\n" +
          "Skriva över den profilens data med filen? Din egen aktiva profil (\"" + ACTIVE_PROFILE + "\") påverkas inte."
        );
      }
      if (!proceed) return;

      applyBackupObj(incoming, name);

      if (isActive) {
        drawAll();
        render();
      } else {
        render(); // uppdaterar profil-väljaren med ev. ny profil, men byter inte vy
        if (isNew && confirm("\"" + name + "\" har lagts till som ny profil. Vill du växla till den nu?")) {
          switchProfile(name);
        }
      }

      var statusEl = document.getElementById("backupStatus2");
      if (statusEl) {
        statusEl.textContent = "✓ Importerat till \"" + name + "\"";
        setTimeout(function () { statusEl.textContent = ""; }, 3000);
      }
    };
    reader.readAsText(file);
  }

  /* ============ urval ============ */

  // Diakritik-okänslig, versal-okänslig normalisering (t.ex. "shogun" hittar "Shōgun").
  function normSearch(s) {
    return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  }

  function draw(kind) {
    var q = state.search ? normSearch(state.search) : "";
    var pool = POOL[kind].filter(function (it) {
      if (state.active.indexOf(it.service) === -1) return false;
      if (state.genre && genreBucket(it.genre) !== state.genre) return false;
      if (state.removed.indexOf(keyOf(it)) !== -1) return false;
      if (state.watched.indexOf(keyOf(it)) !== -1) return false;
      if (state.wantToSee.indexOf(keyOf(it)) !== -1) return false;
      if (q && normSearch(it.title).indexOf(q) === -1) return false;
      return true;
    }).sort(newestFirst);

    // Vid aktiv sökning visas alla träffar direkt, ingen rotation.
    if (q) return sortList(pool);

    if (pool.length <= 10) return sortList(pool);

    // De fyra färskaste följer alltid med, resten roteras.
    var head = pool.slice(0, 4);
    var tail = pool.slice(4);
    var fresh = tail.filter(function (it) { return state.seen.indexOf(keyOf(it)) === -1; });
    if (fresh.length < 6) fresh = tail.slice();

    for (var i = fresh.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = fresh[i]; fresh[i] = fresh[j]; fresh[j] = t;
    }
    var picked = fresh.slice(0, 6);
    state.seen = state.seen.concat(picked.map(keyOf)).slice(-34);
    return sortList(head.concat(picked));
  }

  function drawAll() {
    state.shown.film = draw("film");
    state.shown.serie = draw("serie");
    store.set(SEEN_KEY(), state.seen);
  }

  // Jämför vilka titlar som visades innan en hämtning mot vilka som visas
  // efter, och avgör om något faktiskt nytt tillkom.
  function checkFetchResult(prevKeys) {
    var newKeys = state.shown.film.concat(state.shown.serie).map(keyOf);
    var added = newKeys
      .filter(function (k) { return prevKeys.indexOf(k) === -1; })
      .map(function (k) { return BY_KEY[k]; })
      .filter(Boolean)
      .sort(newestFirst);

    if (added.length) {
      state.lastFetchedTitle = added[0].title;
      state.lastFetchedKind = added[0].kind;
      state.fetchAdded = true;
      state.fetchAddedCount = added.length;
    } else {
      state.fetchAdded = false;
    }
  }

  function card(it, i) {
    var d = parseDate(it);
    var hasDay = it.date.length >= 10;
    var rest = hasDay ? String(d.getDate()).padStart(2, "0") + " " + MONTHS[d.getMonth()] : MONTHS[d.getMonth()];
    var fav = isFav(it);
    var watched = isWatched(it);
    var want = isWantToSee(it);
    var k = keyOf(it);
    var myRating = state.ratings[k] || "";
    var myWho = state.wantWho[k] || "";
    var rateOpts = '<option value="">Betygsätt</option>';
    for (var r = 1; r <= 10; r++) {
      rateOpts += '<option value="' + r + '"' + (myRating === r ? ' selected' : '') + '>Du ' + r + '</option>';
    }
    var link = it.id
      ? "https://www.imdb.com/title/" + it.id + "/"
      : "https://www.imdb.com/search/title/?title=" + encodeURIComponent(it.title) +
        "&title_type=" + (it.kind === "film" ? "feature" : "tvSeries");
    var rtLink = it.rtId
      ? "https://www.rottentomatoes.com/" + (it.kind === "film" ? "m/" : "tv/") + it.rtId + "/"
      : "https://www.rottentomatoes.com/search?search=" + encodeURIComponent(it.title);
    var mcLink = it.mcId
      ? "https://www.metacritic.com/" + (it.kind === "film" ? "movie/" : "tv/") + it.mcId + "/"
      : "https://www.metacritic.com/search/all/" + encodeURIComponent(it.title) + "/results";
    return '<article class="item fade" data-kind="' + it.kind + '" style="animation-delay:' +
      Math.min(i * 40, 400) + 'ms">' +
      '<div class="rail"><span class="dot"></span><div class="yr">' + d.getFullYear() +
      '</div><div class="md">' + rest + "</div></div>" +
      '<div class="body"><div class="head"><h2 class="title">' +
      '<a href="' + link + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + "</a></h2>" +
      '<div class="actions">' +
      '<button class="star" data-want="' + esc(k) + '" data-on="' + (want ? 1 : 0) +
      '" aria-pressed="' + want + '" aria-label="' +
      (want ? "Ta bort " + esc(it.title) + " från vill se" : "Lägg " + esc(it.title) + " i vill se") +
      '">' + (want ? "&#9733;&#65038;" : "&#9734;&#65038;") + "</button>" +
      '<button class="watch" data-watch="' + esc(k) + '" data-on="' + (watched ? 1 : 0) +
      '" aria-pressed="' + watched + '" aria-label="' +
      (watched ? "Lägg tillbaka " + esc(it.title) + " bland tipsen" : "Markera " + esc(it.title) + " som sedd") +
      '">' + (watched ? "&#10004;&#65038;" : "&#9633;&#65038;") + "</button>" +
      '<button class="heart" data-fav="' + esc(k) + '" data-on="' + (fav ? 1 : 0) +
      '" aria-pressed="' + fav + '" aria-label="' +
      (fav ? "Ta bort " + esc(it.title) + " från favoriter" : "Spara " + esc(it.title) + " som favorit") +
      '">' + (fav ? "&hearts;&#65038;" : "&#9825;&#65038;") + "</button>" +
      '<button class="trash" data-remove="' + esc(k) + '" aria-label="Ta bort ' + esc(it.title) +
      ' från tipsen">&#10005;</button>' +
      "</div></div>" +
      '<div class="meta"><span class="svc">' + esc(it.service) + "</span>" +
      '<span class="imdb">IMDb ' + it.imdb.toFixed(1) + "</span>" +
      "<span>" + esc(it.genre) + "</span><span>" + esc(it.length) + "</span>" +
      ((state.tab === "favorit" || state.tab === "sett" || state.tab === "villse") ? "<span>" + (it.kind === "film" ? "Film" : "Serie") + "</span>" : "") +
      "</div>" +
      (function () {
        var hints = [];
        if (myRating) hints.push("Du " + myRating);
        if (state.tab === "villse" && myWho) {
          var whoOpt = WHO_OPTIONS.filter(function (w) { return w.id === myWho; })[0];
          if (whoOpt) hints.push(whoOpt.label);
        }
        var hintText = hints.length ? " (" + hints.map(esc).join(" · ") + ")" : "";
        var isOpen = !!state.expanded[k];
        return '<button class="more-tog" data-more="' + esc(k) + '" aria-expanded="' + isOpen + '">' +
          (isOpen ? "Mindre ▲" : "Mer" + hintText + " ▾") + "</button>" +
          '<div class="more-row"' + (isOpen ? "" : " hidden") + ">" +
          (it.rt ? '<a class="rt" href="' + rtLink + '" target="_blank" rel="noopener noreferrer">RT ' + it.rt + "%</a>" : "") +
          (it.mc ? '<a class="mc" href="' + mcLink + '" target="_blank" rel="noopener noreferrer">MC ' + it.mc + "</a>" : "") +
          '<select class="rate-sel" data-rate="' + esc(k) + '" data-rated="' + (myRating ? 1 : 0) +
          '" aria-label="Sätt ditt betyg för ' + esc(it.title) + '">' + rateOpts + "</select>" +
          (state.tab === "villse"
            ? '<select class="who-sel" data-whoset="' + esc(k) + '" data-set="' + (myWho ? 1 : 0) +
              '" aria-label="Vem vill du se ' + esc(it.title) + ' med"><option value=""' +
              (myWho ? "" : " selected") + '>Se med…</option>' +
              WHO_OPTIONS.map(function (w) {
                return '<option value="' + w.id + '"' +
                  (myWho === w.id ? " selected" : "") + ">" + esc(w.label) + "</option>";
              }).join("") + "</select>"
            : "") +
          "</div>";
      })() +
      '<p class="desc">' + esc(it.desc) + "</p></div></article>";
  }

  function resolveList(keys, applyWhoFilter) {
    var q = state.search ? normSearch(state.search) : "";
    var list = keys.map(function (k) { return BY_KEY[k]; })
      .filter(function (it) { return it && (!state.genre || genreBucket(it.genre) === state.genre); })
      .filter(function (it) { return !q || normSearch(it.title).indexOf(q) !== -1; });
    if (applyWhoFilter && state.whoFilter) {
      list = list.filter(function (it) {
        return (state.wantWho[keyOf(it)] || "") === state.whoFilter;
      });
    }
    return sortList(list);
  }

  }

  function render() {
    var isPage = state.tab === "backup" || state.tab === "removed" || state.tab === "info";
    document.getElementById("tabs").style.display = isPage ? "none" : "";
    document.querySelector(".search-row").style.display = isPage ? "none" : "";
    document.querySelector(".ctrl").style.display = isPage ? "none" : "";
    document.getElementById("list").style.display = isPage ? "none" : "";
    document.getElementById("foot").style.display = isPage ? "none" : "";
    document.getElementById("whoRow").innerHTML = "";
    var menuCount = document.getElementById("menuRemovedCount");
    if (menuCount) menuCount.textContent = "(" + state.removed.length + ")";
    document.getElementById("foot").innerHTML =
      '<button class="foot-link" data-page="info">ℹ Info &amp; förklaring</button>';

    var profilePickRow = document.getElementById("profilePickRow");
    var profileSelectEl = document.getElementById("profileSelect");
    if (state.profiles.length > 1) {
      profilePickRow.style.display = "";
      profileSelectEl.innerHTML = state.profiles.map(function (p) {
        return '<option value="' + esc(p) + '"' + (p === state.activeProfile ? " selected" : "") + '>' + esc(p) + "</option>";
      }).join("");
    } else {
      profilePickRow.style.display = "none";
    }

    if (isPage) {
      if (state.tab === "backup") renderBackupPage();
      else if (state.tab === "info") renderInfoPage();
      else renderRemovedPage();
      return;
    }
    document.getElementById("page").innerHTML = "";

    renderTabs();
    renderChips();

    // Sällskapsfilter visas bara i Vill se-fliken.
    var whoEl = document.getElementById("whoRow");
    if (state.tab === "villse") {
      var counts = {};
      WHO_OPTIONS.forEach(function (w) { counts[w.id] = 0; });
      state.wantToSee.forEach(function (k) {
        var w = state.wantWho[k];
        if (w && counts[w] !== undefined) counts[w]++;
      });
      var rows = [["", "Alla", state.wantToSee.length]].concat(
        WHO_OPTIONS.map(function (w) { return [w.id, w.label, counts[w.id]]; })
      );
      whoEl.innerHTML = '<span class="who-lbl">Se med</span>' +
        rows
          .map(function (w) {
            return '<button class="chip" data-who="' + esc(w[0]) + '" data-on="' +
              (state.whoFilter === w[0] ? 1 : 0) + '" aria-pressed="' +
              (state.whoFilter === w[0]) + '">' + esc(w[1]) + " (" + w[2] + ")</button>";
          }).join("");
    }

    var list;
    if (state.tab === "favorit") list = resolveList(state.favorites);
    else if (state.tab === "sett") list = resolveList(state.watched);
    else if (state.tab === "villse") list = resolveList(state.wantToSee, true);
    else list = state.shown[state.tab];

    var countEl = document.getElementById("searchCount");
    countEl.textContent = state.search
      ? (list.length === 1 ? "1 träff" : list.length + " träffar")
      : "";

    var el = document.getElementById("list");
    if (!list.length) {
      var villseHint = state.whoFilter
        ? "Inget är märkt för det sällskapet än. Välj Alla, eller märk en titel nedan."
        : "Tryck på stjärnan vid ett tips för att lägga det här.";
      var msg, hint;
      if (state.search) {
        msg = "Inga träffar på \u201c" + state.search + "\u201d";
        hint = "Prova ett annat sökord, eller rensa sökningen.";
      } else {
        msg = { film: "Inga tips i listan", serie: "Inga tips i listan",
                    sett: "Inget markerat som sett",
                    villse: state.whoFilter ? "Inget för det sällskapet" : "Inget i Vill se än",
                    favorit: "Inga favoriter än" }[state.tab];
        hint = { film: "Markera minst en av tjänsterna ovan.",
                   serie: "Markera minst en av tjänsterna ovan.",
                   sett: "Tryck på bocken vid ett tips för att lägga det här.",
                   villse: villseHint,
                   favorit: "Tryck på hjärtat vid ett tips så hamnar det här." }[state.tab];
      }
      el.innerHTML = '<div class="empty"><p>' + esc(msg) + "</p><span>" + hint + "</span></div>";
    } else {
      el.innerHTML = list.map(card).join("");
    }
  }

  /* ============ händelser ============ */

  document.addEventListener("click", function (e) {
    // Stänger hamburgarmenyn vid klick utanför den. Måste köras innan
    // knapp-filtreringen nedan, eftersom bakgrundsklick inte är en knapp.
    var dd = document.getElementById("menuDropdown");
    if (dd.classList.contains("open") &&
        !e.target.closest("#menuDropdown") && !e.target.closest("#menuBtn")) {
      closeMenu();
    }

    var t = e.target.closest("button");
    if (!t) return;

    // Kortknapparna byts ut när listan ritas om. Släpp fokus först, annars
    // kan markeringen se ut att hoppa till kortet som tar dess plats.
    if (t.dataset.remove || t.dataset.watch || t.dataset.want || t.dataset.fav || t.dataset.more) {
      t.blur();
    }

    if (t.dataset.tab) { state.tab = t.dataset.tab; state.returnTab = t.dataset.tab; render(); return; }

    if (t.id === "menuBtn") {
      var dd = document.getElementById("menuDropdown");
      var willOpen = !dd.classList.contains("open");
      dd.classList.toggle("open", willOpen);
      t.setAttribute("aria-expanded", willOpen);
      return;
    }

    if (t.dataset.page) {
      closeMenu();
      state.tab = t.dataset.page;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
      return;
    }

    if (t.id === "pageBack") {
      state.tab = state.returnTab || "film";
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
      return;
    }

    if (t.dataset.more) {
      var mk = t.dataset.more;
      state.expanded[mk] = !state.expanded[mk];
      render();
      return;
    }

    if (t.dataset.svc) {
      var s = t.dataset.svc;
      var i = state.active.indexOf(s);
      if (i === -1) state.active.push(s); else state.active.splice(i, 1);
      drawAll(); render(); return;
    }

    if (t.dataset.fav) {
      var k = t.dataset.fav;
      state.favorites = state.favorites.indexOf(k) !== -1
        ? state.favorites.filter(function (f) { return f !== k; })
        : [k].concat(state.favorites);
      store.set(FAV_KEY(), state.favorites);
      render(); return;
    }

    if (t.dataset.watch) {
      var wk = t.dataset.watch;
      state.watched = state.watched.indexOf(wk) !== -1
        ? state.watched.filter(function (w) { return w !== wk; })
        : [wk].concat(state.watched);
      store.set(WATCHED_KEY(), state.watched);
      drawAll(); render(); return;
    }

    if (t.dataset.want) {
      var vk = t.dataset.want;
      if (state.wantToSee.indexOf(vk) !== -1) {
        state.wantToSee = state.wantToSee.filter(function (w) { return w !== vk; });
        delete state.wantWho[vk];
        store.set(WANTWHO_KEY(), state.wantWho);
      } else {
        state.wantToSee = [vk].concat(state.wantToSee);
      }
      store.set(WANT_KEY(), state.wantToSee);
      drawAll(); render(); return;
    }

    if (t.dataset.who !== undefined && t.hasAttribute("data-who")) {
      state.whoFilter = t.dataset.who;
      render(); return;
    }

    if (t.dataset.remove) {
      var rk = t.dataset.remove;
      if (state.removed.indexOf(rk) === -1) state.removed = [rk].concat(state.removed);
      state.favorites = state.favorites.filter(function (f) { return f !== rk; });
      state.watched = state.watched.filter(function (w) { return w !== rk; });
      state.wantToSee = state.wantToSee.filter(function (w) { return w !== rk; });
      delete state.wantWho[rk];
      store.set(REMOVED_KEY(), state.removed);
      store.set(FAV_KEY(), state.favorites);
      store.set(WATCHED_KEY(), state.watched);
      store.set(WANT_KEY(), state.wantToSee);
      store.set(WANTWHO_KEY(), state.wantWho);
      drawAll(); render(); return;
    }

    if (t.dataset.restore) {
      var rsk = t.dataset.restore;
      state.removed = state.removed.filter(function (x) { return x !== rsk; });
      store.set(REMOVED_KEY(), state.removed);
      drawAll(); render(); return;
    }

    if (t.id === "refresh") {
      var prevKeys = state.shown.film.concat(state.shown.serie).map(keyOf);
      drawAll();
      checkFetchResult(prevKeys);
      if (state.tab === "favorit" || state.tab === "sett" || state.tab === "villse") state.tab = "film";
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
      return;
    }

    if (t.id === "exportBtn") { exportBackupFile(); return; }
    if (t.id === "renameProfileBtn") {
      var newName = prompt("Nytt namn på profilen \"" + state.activeProfile + "\":", state.activeProfile);
      if (newName !== null) renameActiveProfile(newName);
      return;
    }
    if (t.dataset.switchProfile) { switchProfile(t.dataset.switchProfile); return; }
    if (t.dataset.deleteProfile) { deleteProfile(t.dataset.deleteProfile); return; }
    if (t.id === "importBtn") { document.getElementById("importFile").click(); return; }
  });

  document.getElementById("homeBtn").addEventListener("click", function () {
    state.tab = "film"; state.returnTab = "film";
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
  document.getElementById("homeBtn").addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); this.click(); }
  });

  document.getElementById("searchBtn").addEventListener("click", function () {
    document.getElementById("searchInput").blur();
  });
  document.getElementById("searchInput").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.target.blur(); }
  });
  document.getElementById("searchInput").addEventListener("input", function (e) {
    state.search = e.target.value;
    document.getElementById("searchClear").hidden = !state.search;
    drawAll(); render();
  });
  document.getElementById("searchClear").addEventListener("click", function () {
    state.search = "";
    var input = document.getElementById("searchInput");
    input.value = "";
    this.hidden = true;
    drawAll(); render();
    input.focus();
  });

  document.getElementById("genreSelect").addEventListener("change", function (e) {
    state.genre = e.target.value;
    drawAll(); render();
  });

  document.getElementById("sortSelect").addEventListener("change", function (e) {
    state.sort = e.target.value;
    drawAll(); render();
  });

  document.addEventListener("change", function (e) {
    var t = e.target;

    if (t.id === "importFile") {
      if (t.files.length) { importBackupFile(t.files[0]); t.value = ""; }
      return;
    }

    if (!t.classList) return;

    if (t.classList.contains("rate-sel")) {
      var k = t.dataset.rate;
      var v = t.value;
      if (v) state.ratings[k] = parseInt(v, 10);
      else delete state.ratings[k];
      store.set(RATING_KEY(), state.ratings);
      render();
      return;
    }

    if (t.classList.contains("who-sel")) {
      var wk = t.dataset.whoset;
      if (t.value) state.wantWho[wk] = t.value;
      else delete state.wantWho[wk];
      store.set(WANTWHO_KEY(), state.wantWho);
      render();
    }
  });

  document.getElementById("profileSelect").addEventListener("change", function (e) {
    switchProfile(e.target.value);
    closeMenu();
  });

  document.getElementById("themeSelect").addEventListener("change", function (e) {
    state.theme = e.target.value;
    document.documentElement.setAttribute("data-theme", state.theme);
    store.set(THEME_KEY, state.theme);
    closeMenu();
  });
  document.getElementById("themeSelect").value = state.theme;
  document.getElementById("sortSelect").value = state.sort;
  document.documentElement.setAttribute("data-theme", state.theme);

  // Fyller titelbanken med data hämtad från titles.json (uppdateras
  // automatiskt en gång i veckan av ett GitHub Actions-jobb).
  function populateFromData(data) {
    POOL.film = data.film || [];
    POOL.serie = data.serie || [];
    ALL_ITEMS = POOL.film.concat(POOL.serie);
    BY_KEY = {};
    ALL_ITEMS.forEach(function (it) { BY_KEY[keyOf(it)] = it; });
    GENRES = Array.from(new Set(ALL_ITEMS.map(function (it) { return genreBucket(it.genre); })))
      .sort(function (a, b) { return a.localeCompare(b, "sv"); });
  }

  document.getElementById("list").innerHTML =
    '<p class="load">Läser in titlar…</p>';

  fetch("titles.json?v=" + Date.now())
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function (data) {
      populateFromData(data);
      drawAll();
      checkFetchResult([]);
      render();
    })
    .catch(function (err) {
      document.getElementById("list").innerHTML =
        '<div class="empty"><p>Kunde inte läsa in titlarna</p><span>' +
        esc(String(err && err.message || err)) +
        ' — kontrollera att titles.json finns i samma mapp som index.html.</span></div>';
    });
})();
</script>

</body>
</html>
