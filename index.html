<style>
*{box-sizing:border-box}
:root{
  --ink:#08080D; --panel:#17181F; --line:#42445C;
  --film:#FFD666; --serie:#7EF0F7; --fav:#FF7F9A; --sett:#7CFF9B;
  --rt:#FF6B4A; --mc:#8FD3FF; --mine:#C9A6FF;
  --txt:#FFFFFF; --dim:#C7C9DE;
  --display:'Oswald','Arial Narrow',Impact,sans-serif;
  --body:'Inter',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  color-scheme: dark;
}
html{background:var(--ink)}
html,body{margin:0;padding:0}
body{background:var(--ink);color:var(--txt);font-family:var(--body);
  min-height:100vh;padding-bottom:56px;-webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%}
.wrap{max-width:880px;margin:0 auto;padding:0 16px}

.bar{background:var(--film);color:var(--ink);padding:10px 16px;
  display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.bar h1{font-family:var(--display);font-weight:700;font-size:26px;
  letter-spacing:.06em;text-transform:uppercase;margin:0;line-height:1}
.today{font-family:var(--mono);font-size:11px;margin-left:auto;letter-spacing:.1em}
.sub{font-family:var(--mono);font-size:11px;color:var(--dim);
  letter-spacing:.1em;padding:12px 0 0;margin:0;text-transform:uppercase}

.tabs{display:flex;gap:2px;margin:16px 0 12px}
.tab{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--dim);
  font-family:var(--display);font-size:14px;letter-spacing:.09em;text-transform:uppercase;
  padding:11px 6px;cursor:pointer;border-radius:0;transition:.16s}
.tab:hover{color:var(--txt)}
.tab[data-on="film"]{background:var(--film);color:var(--ink);border-color:var(--film)}
.tab[data-on="serie"]{background:var(--serie);color:var(--ink);border-color:var(--serie)}
.tab[data-on="favorit"]{background:var(--fav);color:var(--ink);border-color:var(--fav)}
.tab[data-on="sett"]{background:var(--sett);color:var(--ink);border-color:var(--sett)}
.tab b{font-family:var(--mono);font-size:11px;font-weight:700;margin-left:6px}

.ctrl{border:1px solid var(--line);background:var(--panel);padding:12px;margin-bottom:18px}
.lbl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--dim);
  text-transform:uppercase;display:block;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.06em;
  padding:6px 10px;border:1px solid var(--line);background:transparent;color:var(--dim);
  cursor:pointer;transition:.16s}
.chip[data-on="1"]{background:var(--txt);color:var(--ink);border-color:var(--txt)}
.row2{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
.fetch-status{font-family:var(--mono);font-size:11px;color:var(--dim);
  letter-spacing:.03em;margin:10px 0 0;line-height:1.5}
.fetch-status b{color:var(--txt);font-weight:700}
.fetch-status.is-new{color:var(--sett)}
.fetch-status.is-new b{color:var(--sett)}
.btn{font-family:var(--display);font-size:14px;letter-spacing:.09em;text-transform:uppercase;
  background:var(--film);color:var(--ink);border:none;padding:11px 18px;cursor:pointer}
.btn:active{transform:translateY(1px)}
.select-wrap{position:relative;flex:1 1 160px}
.select-wrap:after{content:'▾';position:absolute;right:10px;top:50%;transform:translateY(-50%);
  color:var(--dim);pointer-events:none;font-size:11px}
.gsel{appearance:none;-webkit-appearance:none;width:100%;background:var(--ink);
  border:1px solid var(--line);color:var(--txt);font-family:var(--mono);font-size:12px;
  padding:10px 28px 10px 10px;cursor:pointer}
.chip:focus-visible,.tab:focus-visible,.btn:focus-visible,.heart:focus-visible,
.watch:focus-visible,.trash:focus-visible,.gsel:focus-visible,.rm-restore:focus-visible,
.title a:focus-visible{outline:2px solid var(--film);outline-offset:2px}

.item{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.rail{width:52px;flex:0 0 52px;text-align:right;font-family:var(--mono);
  position:relative;padding-right:14px}
.rail:after{content:'';position:absolute;right:0;top:6px;bottom:-16px;width:1px;background:var(--line)}
.dot{position:absolute;right:-3px;top:6px;width:7px;height:7px;background:var(--film)}
.item[data-kind="serie"] .dot{background:var(--serie)}
.yr{font-size:15px;font-weight:700;line-height:1}
.md{font-size:10px;color:var(--dim);letter-spacing:.08em;margin-top:4px}
.body{flex:1;min-width:0}
.head{display:flex;gap:10px;align-items:flex-start}
.title{font-family:var(--display);font-size:21px;font-weight:600;line-height:1.15;
  letter-spacing:.01em;margin:0;flex:1}
.title a{color:inherit;text-decoration:none;border-bottom:1px solid transparent}
.title a:hover{border-bottom-color:var(--film)}
.meta{font-family:var(--mono);font-size:11px;color:var(--dim);margin:7px 0 0;
  letter-spacing:.05em;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.svc{color:var(--ink);background:var(--film);padding:2px 6px;font-weight:700}
.item[data-kind="serie"] .svc{background:var(--serie)}
.imdb{color:var(--film);font-weight:700}
.rt{color:var(--rt);font-weight:700}
.mc{color:var(--mc);font-weight:700}
.rate-sel{background:transparent;border:1px solid var(--line);color:var(--mine);
  font-family:var(--mono);font-size:11px;font-weight:700;padding:2px 5px;
  border-radius:0;-webkit-appearance:none;appearance:none;cursor:pointer}
.rate-sel:hover{border-color:var(--mine)}
.rate-sel[data-rated="1"]{border-color:var(--mine);background:rgba(201,166,255,.14)}
.rate-sel:focus-visible{outline:2px solid var(--film);outline-offset:2px}
.desc{font-size:14px;line-height:1.55;color:#E7E8F5;margin:8px 0 0}
.actions{display:flex;gap:6px;flex-shrink:0}
.heart,.watch,.trash{background:none;border:1px solid var(--line);color:var(--dim);cursor:pointer;
  width:38px;height:38px;flex:0 0 38px;font-size:17px;line-height:1;transition:.16s}
.heart:hover{color:var(--fav);border-color:var(--fav)}
.heart[data-on="1"]{color:var(--fav);border-color:var(--fav);background:rgba(255,127,154,.12)}
.watch:hover{color:var(--sett);border-color:var(--sett)}
.watch[data-on="1"]{color:var(--sett);border-color:var(--sett);background:rgba(124,255,155,.12)}
.trash:hover{color:#FF6259;border-color:#FF6259}

#removedPanel:empty{display:none}
#removedPanel{border:1px dashed var(--line);padding:4px 12px;margin:-6px 0 18px;font-family:var(--mono);font-size:12px}
.rm-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.rm-row:last-child{border-bottom:none}
.rm-restore{background:none;border:1px solid var(--line);color:var(--dim);font-family:var(--mono);
  font-size:11px;padding:5px 9px;cursor:pointer}
.rm-restore:hover{color:var(--txt);border-color:var(--txt)}

.empty{border:1px dashed var(--line);padding:28px 20px;text-align:center}
.empty p{margin:0 0 6px;font-family:var(--display);font-size:18px;letter-spacing:.05em;text-transform:uppercase}
.empty span{font-size:13px;color:var(--dim)}
.foot{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.08em;
  text-align:center;padding-top:26px;line-height:1.9}
.fade{animation:in .32s ease both}
@keyframes in{from{opacity:0;transform:translateY(7px)}}
@media (prefers-reduced-motion:reduce){.fade{animation:none!important}}
@media (max-width:520px){
  .title{font-size:18px}
  .rail{width:44px;flex:0 0 44px;padding-right:11px}
  .bar h1{font-size:21px}
  .btn,.select-wrap{width:100%;flex:1 1 100%}
  .heart,.watch,.trash{width:34px;height:34px;flex:0 0 34px;font-size:15px}
  .actions{gap:4px}
}
</style>
</head>

    ["The Bear","2022-06-23","Disney+",8.6,100,94,"Dramakomedi","1 säsong","Stjärnkock tar över familjens smörgåsbar i Chicago. Stressigt och strålande.","tt14452776"],
    ["Pachinko","2022-03-25","Apple TV+",8.4,96,88,"Historiskt drama","1 säsong","Fyra generationer koreaner i Japan. Vackert filmat familjeepos.","tt8888462"],
    ["Reacher","2022-02-04","Prime Video",8.1,84,63,"Action","1 säsong","Väldigt stor man löser brott i småstad. Precis så bra som det låter.","tt9288030"],
    ["Arcane","2021-11-06","Netflix",9.0,100,93,"Animerat","1 säsong","Systrar på var sin sida i en klasskonflikt. Animation i världsklass.","tt11126994"],
    ["Squid Game","2021-09-17","Netflix",8.0,95,81,"Thriller","1 säsong","Skuldsatta spelar barnlekar om livet. Fenomenet som startade allt.","tt10919420"],
    ["Only Murders in the Building","2021-08-31","Disney+",8.1,96,78,"Mysteriekomedi","1 säsong","Tre poddande grannar utreder ett mord i sitt eget hus.","tt11691774"],
    ["Hacks","2021-05-13","HBO Max",8.2,96,84,"Komedi","1 säsong","Åldrande Vegaskomiker och ung manusförfattare avskyr varandra. Först.","tt11815682"],
    ["Invincible","2021-03-25","Prime Video",8.7,98,82,"Animerat","1 säsong","Tonårshjälte upptäcker sanningen om sin far. Långt blodigare än väntat.","tt6741278"]
  ];

  function toObj(row, kind) {
    return { title: row[0], date: row[1], service: row[2], imdb: row[3], rt: row[4], mc: row[5],
             genre: row[6], length: row[7], desc: row[8], id: row[9] || "", kind: kind };
  }
  var POOL = {
    film: FILM.map(function (r) { return toObj(r, "film"); }),
    serie: SERIE.map(function (r) { return toObj(r, "serie"); })
  };
  var ALL_ITEMS = POOL.film.concat(POOL.serie);
  var BY_KEY = {};
  ALL_ITEMS.forEach(function (it) { BY_KEY[keyOf(it)] = it; });
  var GENRES = Array.from(new Set(ALL_ITEMS.map(function (it) { return it.genre; })))
    .sort(function (a, b) { return a.localeCompare(b, "sv"); });

  /* ============ hjälpare ============ */

  var store = {
    get: function (k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  function parseDate(it) {
    var s = it.date;
    var d = new Date(s.length === 7 ? s + "-01" : s);
    return isNaN(d.getTime()) ? new Date("2021-01-01") : d;
  }
  function newestFirst(a, b) { return parseDate(b) - parseDate(a); }
  function keyOf(it) { return it.kind + ":" + it.title + ":" + it.date; }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  // Äldre versioner sparade hela objekt som favoriter; gör om till nycklar.
  function normalizeKeys(list) {
    if (!Array.isArray(list)) return [];
    return list.map(function (x) {
      if (typeof x === "string") return x;
      if (x && x.kind && x.title) return keyOf(x);
      return null;
    }).filter(Boolean);
  }

  var state = {
    tab: "film",
    active: SERVICES.slice(),
    genre: "",
    favorites: normalizeKeys(store.get(FAV_KEY)),
    watched: normalizeKeys(store.get(WATCHED_KEY)),
    removed: normalizeKeys(store.get(REMOVED_KEY)),
    ratings: store.get(RATING_KEY) || {},
    seen: store.get(SEEN_KEY) || [],
    showRemoved: false,
    lastFetchedTitle: null,
    lastFetchedKind: null,
    fetchAdded: null,
    fetchAddedCount: 0,
    shown: { film: [], serie: [] }
  };

  document.getElementById("today").textContent =
    String(NOW.getDate()).padStart(2, "0") + " " + MONTHS[NOW.getMonth()] + " " + NOW.getFullYear();

  /* ============ urval ============ */

  function draw(kind) {
    var pool = POOL[kind].filter(function (it) {
      if (state.active.indexOf(it.service) === -1) return false;
      if (state.genre && it.genre !== state.genre) return false;
      if (state.removed.indexOf(keyOf(it)) !== -1) return false;
      if (state.watched.indexOf(keyOf(it)) !== -1) return false;
      return true;
    }).sort(newestFirst);

    if (pool.length <= 10) return pool;

    // De fyra färskaste följer alltid med, resten roteras.
    var head = pool.slice(0, 4);
    var tail = pool.slice(4);
    var fresh = tail.filter(function (it) { return state.seen.indexOf(keyOf(it)) === -1; });
    if (fresh.length < 6) fresh = tail.slice();

    for (var i = fresh.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = fresh[i]; fresh[i] = fresh[j]; fresh[j] = t;
    }
    var picked = fresh.slice(0, 6);
    state.seen = state.seen.concat(picked.map(keyOf)).slice(-34);
    return head.concat(picked).sort(newestFirst);
  }

  function drawAll() {
    state.shown.film = draw("film");
    state.shown.serie = draw("serie");
    store.set(SEEN_KEY, state.seen);
  }

  // Jämför vilka titlar som visades innan en hämtning mot vilka som visas
  // efter, och avgör om något faktiskt nytt tillkom.
  function checkFetchResult(prevKeys) {
    var newKeys = state.shown.film.concat(state.shown.serie).map(keyOf);
    var added = newKeys
      .filter(function (k) { return prevKeys.indexOf(k) === -1; })
      .map(function (k) { return BY_KEY[k]; })
      .filter(Boolean)
      .sort(newestFirst);

    if (added.length) {
      state.lastFetchedTitle = added[0].title;
      state.lastFetchedKind = added[0].kind;
      state.fetchAdded = true;
      state.fetchAddedCount = added.length;
    } else {
      state.fetchAdded = false;
    }
  }

  /* ============ rendering ============ */

  function isFav(it) { return state.favorites.indexOf(keyOf(it)) !== -1; }
  function isWatched(it) { return state.watched.indexOf(keyOf(it)) !== -1; }

  function renderTabs() {
    var defs = [["film", "Filmer", state.shown.film.length],
                ["serie", "Serier", state.shown.serie.length],
                ["sett", "Sett", state.watched.length],
                ["favorit", "Favoriter", state.favorites.length]];
    document.getElementById("tabs").innerHTML = defs.map(function (d) {
      return '<button class="tab" data-tab="' + d[0] + '"' +
        (state.tab === d[0] ? ' data-on="' + d[0] + '"' : "") +
        ' aria-pressed="' + (state.tab === d[0]) + '">' + d[1] + "<b>" + d[2] + "</b></button>";
    }).join("");
  }

  function renderChips() {
    document.getElementById("chips").innerHTML = SERVICES.map(function (s) {
      var on = state.active.indexOf(s) !== -1;
      return '<button class="chip" data-svc="' + esc(s) + '" data-on="' + (on ? 1 : 0) +
        '" aria-pressed="' + on + '">' + esc(s) + "</button>";
    }).join("");

    var sel = document.getElementById("genreSelect");
    if (sel.options.length <= 1) {
      GENRES.forEach(function (g) {
        var opt = document.createElement("option");
        opt.value = g; opt.textContent = g;
        sel.appendChild(opt);
      });
    }
    sel.value = state.genre;

    var rm = document.getElementById("toggleRemoved");
    rm.textContent = "Borttagna (" + state.removed.length + ")";
    rm.setAttribute("data-on", state.showRemoved ? "1" : "0");

    var fs = document.getElementById("fetchStatus");
    if (state.lastFetchedTitle) {
      var kindLabel = state.lastFetchedKind === "film" ? "film" : "serie";
      if (state.fetchAdded) {
        var extra = state.fetchAddedCount > 1 ? " (+" + (state.fetchAddedCount - 1) + " till)" : "";
        fs.className = "fetch-status is-new";
        fs.innerHTML = "🆕 Nytt tips hämtat: <b>" + esc(state.lastFetchedTitle) + "</b> (" + kindLabel + ")" + extra;
      } else {
        fs.className = "fetch-status";
        fs.innerHTML = "Inga nya tips hittades den här gången. Senast hämtat: <b>" +
          esc(state.lastFetchedTitle) + "</b> (" + kindLabel + ")";
      }
    } else {
      fs.className = "fetch-status";
      fs.innerHTML = "";
    }
  }

  function card(it, i) {
    var d = parseDate(it);
    var hasDay = it.date.length >= 10;
    var rest = hasDay ? String(d.getDate()).padStart(2, "0") + " " + MONTHS[d.getMonth()] : MONTHS[d.getMonth()];
    var fav = isFav(it);
    var watched = isWatched(it);
    var k = keyOf(it);
    var myRating = state.ratings[k] || "";
    var rateOpts = '<option value="">Betygsätt</option>';
    for (var r = 1; r <= 10; r++) {
      rateOpts += '<option value="' + r + '"' + (myRating === r ? ' selected' : '') + '>Du ' + r + '</option>';
    }
    var link = it.id
      ? "https://www.imdb.com/title/" + it.id + "/"
      : "https://www.imdb.com/search/title/?title=" + encodeURIComponent(it.title) +
        "&title_type=" + (it.kind === "film" ? "feature" : "tvSeries");
    return '<article class="item fade" data-kind="' + it.kind + '" style="animation-delay:' +
      Math.min(i * 40, 400) + 'ms">' +
      '<div class="rail"><span class="dot"></span><div class="yr">' + d.getFullYear() +
      '</div><div class="md">' + rest + "</div></div>" +
      '<div class="body"><div class="head"><h2 class="title">' +
      '<a href="' + link + '" target="_blank" rel="noopener">' + esc(it.title) + "</a></h2>" +
      '<div class="actions">' +
      '<button class="watch" data-watch="' + esc(k) + '" data-on="' + (watched ? 1 : 0) +
      '" aria-pressed="' + watched + '" aria-label="' +
      (watched ? "Lägg tillbaka " + esc(it.title) + " bland tipsen" : "Markera " + esc(it.title) + " som sedd") +
      '">' + (watched ? "&#10004;" : "&#9633;") + "</button>" +
      '<button class="heart" data-fav="' + esc(k) + '" data-on="' + (fav ? 1 : 0) +
      '" aria-pressed="' + fav + '" aria-label="' +
      (fav ? "Ta bort " + esc(it.title) + " från favoriter" : "Spara " + esc(it.title) + " som favorit") +
      '">' + (fav ? "&hearts;" : "&#9825;") + "</button>" +
      '<button class="trash" data-remove="' + esc(k) + '" aria-label="Ta bort ' + esc(it.title) +
      ' från tipsen">&#10005;</button>' +
      "</div></div>" +
      '<div class="meta"><span class="svc">' + esc(it.service) + "</span>" +
      '<span class="imdb">IMDb ' + it.imdb.toFixed(1) + "</span>" +
      (it.rt ? '<span class="rt">RT ' + it.rt + "%</span>" : "") +
      (it.mc ? '<span class="mc">MC ' + it.mc + "</span>" : "") +
      '<select class="rate-sel" data-rate="' + esc(k) + '" data-rated="' + (myRating ? 1 : 0) +
      '" aria-label="Sätt ditt betyg för ' + esc(it.title) + '">' + rateOpts + "</select>" +
      "<span>" + esc(it.genre) + "</span><span>" + esc(it.length) + "</span>" +
      ((state.tab === "favorit" || state.tab === "sett") ? "<span>" + (it.kind === "film" ? "Film" : "Serie") + "</span>" : "") +
      '</div><p class="desc">' + esc(it.desc) + "</p></div></article>";
  }

  function resolveList(keys) {
    return keys.map(function (k) { return BY_KEY[k]; })
      .filter(function (it) { return it && (!state.genre || it.genre === state.genre); })
      .sort(newestFirst);
  }

  function render() {
    renderTabs();
    renderChips();

    var list;
    if (state.tab === "favorit") list = resolveList(state.favorites);
    else if (state.tab === "sett") list = resolveList(state.watched);
    else list = state.shown[state.tab];

    var el = document.getElementById("list");
    if (!list.length) {
      var msg = { film: "Inga tips i listan", serie: "Inga tips i listan",
                  sett: "Inget markerat som sett", favorit: "Inga favoriter än" }[state.tab];
      var hint = { film: "Markera minst en av tjänsterna ovan.",
                   serie: "Markera minst en av tjänsterna ovan.",
                   sett: "Tryck på bocken vid ett tips för att lägga det här.",
                   favorit: "Tryck på hjärtat vid ett tips så hamnar det här." }[state.tab];
      el.innerHTML = '<div class="empty"><p>' + msg + "</p><span>" + hint + "</span></div>";
    } else {
      el.innerHTML = list.map(card).join("");
    }

    var rp = document.getElementById("removedPanel");
    if (state.showRemoved && state.removed.length) {
      rp.innerHTML = state.removed.map(function (k) {
        var it = BY_KEY[k];
        if (!it) return "";
        return '<div class="rm-row"><span>' + esc(it.title) + " (" + (it.kind === "film" ? "film" : "serie") + ")</span>" +
          '<button class="rm-restore" data-restore="' + esc(k) + '">Återställ</button></div>';
      }).join("");
    } else {
      rp.innerHTML = "";
    }

    document.getElementById("foot").innerHTML =
      "Titelbanken innehåller " + (FILM.length + SERIE.length) +
      " titlar, alla med IMDb-betyg. Ladda om sidan för nya tips.<br>" +
      "☐ Markera som sedd · ♡ Spara som favorit · ✕ Ta bort ur tipsen.<br>" +
      "RT = Rotten Tomatoes, MC = Metacritic (visas när de finns). \"Du\" är ditt eget betyg (1–10), sparas bara i den här webbläsaren.<br>" +
      "Klicka på titeln för att öppna den på IMDb.";
  }

  /* ============ händelser ============ */

  document.addEventListener("click", function (e) {
    var t = e.target.closest("button");
    if (!t) return;

    if (t.dataset.tab) { state.tab = t.dataset.tab; render(); return; }

    if (t.dataset.svc) {
      var s = t.dataset.svc;
      var i = state.active.indexOf(s);
      if (i === -1) state.active.push(s); else state.active.splice(i, 1);
      drawAll(); render(); return;
    }

    if (t.dataset.fav) {
      var k = t.dataset.fav;
      state.favorites = state.favorites.indexOf(k) !== -1
        ? state.favorites.filter(function (f) { return f !== k; })
        : [k].concat(state.favorites);
      store.set(FAV_KEY, state.favorites);
      render(); return;
    }

    if (t.dataset.watch) {
      var wk = t.dataset.watch;
      state.watched = state.watched.indexOf(wk) !== -1
        ? state.watched.filter(function (w) { return w !== wk; })
        : [wk].concat(state.watched);
      store.set(WATCHED_KEY, state.watched);
      drawAll(); render(); return;
    }

    if (t.dataset.remove) {
      var rk = t.dataset.remove;
      if (state.removed.indexOf(rk) === -1) state.removed = [rk].concat(state.removed);
      state.favorites = state.favorites.filter(function (f) { return f !== rk; });
      state.watched = state.watched.filter(function (w) { return w !== rk; });
      store.set(REMOVED_KEY, state.removed);
      store.set(FAV_KEY, state.favorites);
      store.set(WATCHED_KEY, state.watched);
      drawAll(); render(); return;
    }

    if (t.dataset.restore) {
      var rsk = t.dataset.restore;
      state.removed = state.removed.filter(function (x) { return x !== rsk; });
      store.set(REMOVED_KEY, state.removed);
      drawAll(); render(); return;
    }

    if (t.id === "toggleRemoved") { state.showRemoved = !state.showRemoved; render(); return; }

    if (t.id === "refresh") {
      var prevKeys = state.shown.film.concat(state.shown.serie).map(keyOf);
      drawAll();
      checkFetchResult(prevKeys);
      if (state.tab === "favorit" || state.tab === "sett") state.tab = "film";
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
  });

  document.getElementById("genreSelect").addEventListener("change", function (e) {
    state.genre = e.target.value;
    drawAll(); render();
  });

  document.addEventListener("change", function (e) {
    var t = e.target;
    if (!t.classList || !t.classList.contains("rate-sel")) return;
    var k = t.dataset.rate;
    var v = t.value;
    if (v) state.ratings[k] = parseInt(v, 10);
    else delete state.ratings[k];
    store.set(RATING_KEY, state.ratings);
    render();
  });

  drawAll();
  checkFetchResult([]);
  render();
})();
</script>
</body>
