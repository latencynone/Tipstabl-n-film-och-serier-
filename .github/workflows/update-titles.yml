name: Uppdatera titlar

on:
  schedule:
    # Varje måndag kl 06:00 svensk tid (05:00 UTC vintertid / 04:00 UTC sommartid,
    # cron kör alltid i UTC så tiden kan skifta en timme med sommartid)
    - cron: "0 5 * * 1"
  workflow_dispatch: {}  # gör det möjligt att köra manuellt från Actions-fliken

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checka ut repot
        uses: actions/checkout@v4

      - name: Sätt upp Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kör uppdateringsskriptet
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: python scripts/update_titles.py

      - name: Committa ändringar om det finns några
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- titles.json; then
            echo "Inga ändringar i titles.json den här veckan."
          else
            git add titles.json
            git commit -m "Automatisk titeluppdatering $(date +%Y-%m-%d)"
            git push
          fi
